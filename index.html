  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',

  <style>

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass {
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(22, 30, 49, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      background: rgba(30, 41, 67, 0.75);
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -10px rgba(2, 132, 199, 0.25);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen relative overflow-x-hidden selection:bg-sky-500 selection:text-white">

              All Systems Operational

          <p id="greeting-text" class="text-xs text-slate-400">下午好，极客生活由此开始</p>

        </div>
        <button id="add-card-btn" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition-colors border border-white/10" title="添加新书签">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- 聚合搜索栏 -->
    <section class="mb-10 max-w-2xl mx-auto w-full">
      <div class="glass rounded-2xl p-2 shadow-2xl shadow-black/40">
        <!-- 搜索引擎切换 -->
        <div class="flex items-center gap-1 px-2 pt-1 pb-2 border-b border-white/5 text-xs overflow-x-auto">
          <button data-engine="google" class="search-tab active px-3 py-1 rounded-lg text-white font-medium bg-white/10 transition-colors whitespace-nowrap">Google</button>
          <button data-engine="baidu" class="search-tab px-3 py-1 rounded-lg text-slate-400 hover:text-white transition-colors whitespace-nowrap">百度</button>
          <button data-engine="github" class="search-tab px-3 py-1 rounded-lg text-slate-400 hover:text-white transition-colors whitespace-nowrap">GitHub</button>
          <button data-engine="douban" class="search-tab px-3 py-1 rounded-lg text-slate-400 hover:text-white transition-colors whitespace-nowrap">豆瓣电影</button>

        </div>
        <!-- 搜索输入框 -->

    </section>

    <!-- 核心卡片网格区域 -->

    </main>

  </div>

  <!-- 添加新卡片弹窗 Modal -->

    <div class="glass w-full max-w-md rounded-2xl p-6 shadow-2xl border border-white/10">

        <button id="close-modal-btn" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>

      <form id="add-card-form" class="space-y-4">
        <div>

            <option value="ops">🖥️ 探针与监控 (Operations)</option>
            <option value="tools">🛠️ 极客生活工具 (Tools)</option>
            <option value="cloud">🔐 核心基础设施 (Cloud & Infra)</option>

        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">网站名称</label>
          <input type="text" id="card-title" required placeholder="如：我的网盘" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-white/10 text-white text-xs focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">链接地址 (URL)</label>
          <input type="url" id="card-url" required placeholder="https://..." class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-white/10 text-white text-xs focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">简介说明</label>
          <input type="text" id="card-desc" placeholder="简要描述站点用途" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-white/10 text-white text-xs focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">图标 (Lucide 图标名)</label>
          <input type="text" id="card-icon" placeholder="如 tv, server, shield, globe" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-white/10 text-white text-xs focus:outline-none focus:border-sky-500">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancel-modal-btn" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-xs text-slate-300">取消</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-semibold text-white">添加保存</button>
        </div>
      </form>
    </div>
  </div>

  <input type="file" id="import-file-input" accept=".json" class="hidden">

  <!-- 核心逻辑脚本 -->
  <script>

          }
        ]
      },
      {
        id: 'cloud',
        title: '核心基础设施与控制台',
        icon: 'shield-check',
        badge: 'Core Infrastructure',
        items: [
          {
            name: 'Bitwarden 密码库',
            url: 'https://bit.dpdns.org',
            desc: '自托管端到端加密密码管理器 (每日自动更新)',
            icon: 'shield',
            color: 'from-blue-500 to-sky-600',
            tag: '核心'
          },
          {
            name: 'Cloudflare 控制台',
            url: 'https://dash.cloudflare.com',
            desc: 'Workers & Pages / DNS / R2 / 域名解析管理',
            icon: 'cloud',

          },
          {

            url: 'https://github.com/bithou',
            desc: '个人代码仓库、自动化 CI/CD 与开源项目',
            icon: 'github',
            color: 'from-slate-600 to-slate-800'
          }
        ]
      }
    ];

    let navData = JSON.parse(localStorage.getItem('bithou_nav_data')) || DEFAULT_DATA;

    function renderNav() {
      const container = document.getElementById('categories-container');
      container.innerHTML = '';

      navData.forEach(cat => {
        const section = document.createElement('section');
        section.className = 'space-y-3';
        section.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="p-1.5 rounded-lg bg-white/5 border border-white/10 text-sky-400">
                <i data-lucide="${cat.icon || 'folder'}" class="w-4 h-4"></i>
              </div>
              <h2 class="text-sm font-bold text-white tracking-wide">${cat.title}</h2>
            </div>
            <span class="text-[11px] font-mono text-slate-500 uppercase">${cat.badge || ''}</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5">
            ${cat.items.map(item => `
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
                 class="glass-card rounded-xl p-3.5 flex items-start gap-3 group relative overflow-hidden">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr ${item.color || 'from-sky-500 to-indigo-500'} flex items-center justify-center text-white flex-shrink-0 shadow-md shadow-black/20 group-hover:scale-105 transition-transform">
                  <i data-lucide="${item.icon || 'link'}" class="w-5 h-5"></i>
                </div>
                <div class="flex-grow min-w-0">
                  <div class="flex items-center justify-between gap-1 mb-1">
                    <h3 class="text-xs font-semibold text-white truncate group-hover:text-sky-300 transition-colors">${item.name}</h3>
                    ${item.tag ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 font-medium border border-sky-500/30 flex-shrink-0">${item.tag}</span>` : ''}
                    ${item.statusDot ? `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse flex-shrink-0" title="Online"></span>` : ''}
                  </div>
                  <p class="text-[11px] text-slate-400 line-clamp-2 leading-relaxed">${item.desc || item.url}</p>
                </div>
              </a>
            `).join('')}
          </div>
        `;
        container.appendChild(section);
      });

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('zh-CN', options);

      const hour = now.getHours();
      let greeting = '夜深了，注意休息 🌙';
      if (hour >= 5 && hour < 12) greeting = '早上好，Bithou ☀️ 保持活力的一天';
      else if (hour >= 12 && hour < 14) greeting = '中午好，享受午休与美食 ☕';
      else if (hour >= 14 && hour < 18) greeting = '下午好，Bithou 👨‍💻 高效专注进行时';
      else if (hour >= 18 && hour < 23) greeting = '晚上好，放松一下看看电影 🎬';
      document.getElementById('greeting-text').textContent = greeting;
    }

    setInterval(updateClock, 1000);
    updateClock();

    let currentEngine = 'google';
    const ENGINES = {
      google: q => `https://www.google.com/search?q=${encodeURIComponent(q)}`,
      baidu: q => `https://www.baidu.com/s?wd=${encodeURIComponent(q)}`,
      github: q => `https://github.com/search?q=${encodeURIComponent(q)}`,
      douban: q => `https://search.douban.com/movie/subject_search?search_text=${encodeURIComponent(q)}`,
      moontv: q => `https://tv.282855.xyz/search?q=${encodeURIComponent(q)}`
    };

    document.querySelectorAll('.search-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.search-tab').forEach(t => {
          t.classList.remove('active', 'bg-white/10', 'text-white');
          t.classList.add('text-slate-400');
        });
        tab.classList.add('active', 'bg-white/10', 'text-white');
        tab.classList.remove('text-slate-400');
        currentEngine = tab.dataset.engine;
        document.getElementById('search-input').focus();
      });
    });

    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      if (query.match(/^https?:\/\//i) || query.match(/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/)) {
        const url = query.startsWith('http') ? query : `https://${query}`;
        window.open(url, '_blank');
        return;
      }

      const targetUrl = ENGINES[currentEngine](query);
      window.open(targetUrl, '_blank');
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
    });

    const modal = document.getElementById('add-modal');
    document.getElementById('add-card-btn').addEventListener('click', () => modal.classList.remove('hidden'));
    document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));
    document.getElementById('cancel-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));

    document.getElementById('add-card-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const catId = document.getElementById('card-category').value;
      const title = document.getElementById('card-title').value.trim();
      const url = document.getElementById('card-url').value.trim();
      const desc = document.getElementById('card-desc').value.trim();
      const icon = document.getElementById('card-icon').value.trim() || 'globe';

      const cat = navData.find(c => c.id === catId);
      if (cat) {
        cat.items.push({
          name: title,
          url: url,
          desc: desc,
          icon: icon,
          color: 'from-blue-500 to-indigo-600'
        });
        localStorage.setItem('bithou_nav_data', JSON.stringify(navData));
        renderNav();
        modal.classList.add('hidden');
        document.getElementById('add-card-form').reset();
      }
    });

    document.getElementById('export-config-btn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(navData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `bithou_nav_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    document.getElementById('import-config-btn').addEventListener('click', () => {
      document.getElementById('import-file-input').click();
    });

    document.getElementById('import-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            navData = imported;
            localStorage.setItem('bithou_nav_data', JSON.stringify(navData));
            renderNav();
            alert('导航配置已成功导入！');
          }
        } catch (err) {
          alert('导入失败，JSON 格式无效！');
        }
      };
      reader.readAsText(file);
    });

    renderNav();
  </script>
</body>
</html>
