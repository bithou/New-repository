      {
        id: 'cloud',
        title: '基础设施与平台',
        icon: 'shield-check',
        badge: 'Infrastructure & Platforms',
        items: [
          {
            name: 'Bitwarden 密码库',
            url: 'https://mm.822555.xyz',
            desc: '自托管端到端加密密码管理器 (安全门禁保护)',
            icon: 'shield',
            color: 'from-blue-500 to-sky-600',
            tag: '核心'
          },
          {
            name: 'Cloudflare 控制台',
            url: 'https://dash.cloudflare.com',
            desc: 'Workers & Pages / DNS / R2 / 域名解析管理',
            icon: 'cloud',
            color: 'from-amber-500 to-orange-600'
          },
          {
            name: 'GitHub (bithou)',
            url: 'https://github.com/bithou',
            desc: '个人代码仓库、自动化 CI/CD 与开源项目',
            icon: 'github',
            color: 'from-slate-600 to-slate-800'
          }
        ]
      }
    ];

    const DATA_VERSION = 'v20260909_2';
    if (localStorage.getItem('bithou_nav_version') !== DATA_VERSION) {
      localStorage.setItem('bithou_nav_data', JSON.stringify(DEFAULT_DATA));
      localStorage.setItem('bithou_nav_version', DATA_VERSION);
    }

    let navData = JSON.parse(localStorage.getItem('bithou_nav_data')) || DEFAULT_DATA;

    // 针对 Lucide 未收录或品牌专有图标提供精致矢量 SVG
    const BRAND_ICONS = {
      github: `<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>`,
      youtube: `<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`
    };

    function renderNav() {
      const container = document.getElementById('categories-container');
      container.innerHTML = '';

      navData.forEach(cat => {
        const section = document.createElement('section');
        section.className = 'space-y-3';
        section.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="p-1.5 rounded-lg bg-white/5 border border-white/10 text-sky-400">
                <i data-lucide="${cat.icon || 'folder'}" class="w-4 h-4"></i>
              </div>
              <h2 class="text-sm font-bold text-white tracking-wide">${cat.title}</h2>
            </div>
            <span class="text-[11px] font-mono text-slate-500 uppercase">${cat.badge || ''}</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5">
            ${cat.items.map(item => `
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
                 class="glass-card rounded-xl p-3.5 flex items-start gap-3 group relative overflow-hidden">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr ${item.color || 'from-sky-500 to-indigo-500'} flex items-center justify-center text-white flex-shrink-0 shadow-md shadow-black/20 group-hover:scale-105 transition-transform">
                  ${BRAND_ICONS[item.icon] || `<i data-lucide="${item.icon || 'link'}" class="w-5 h-5"></i>`}
                </div>
                <div class="flex-grow min-w-0">
                  <div class="flex items-center justify-between gap-1 mb-1">
                    <h3 class="text-xs font-semibold text-white truncate group-hover:text-sky-300 transition-colors">${item.name}</h3>
                    ${item.tag ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 font-medium border border-sky-500/30 flex-shrink-0">${item.tag}</span>` : ''}
                    ${item.statusDot ? `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse flex-shrink-0" title="Online"></span>` : ''}
                  </div>
                  <p class="text-[11px] text-slate-400 line-clamp-2 leading-relaxed">${item.desc || item.url}</p>
                </div>
              </a>
            `).join('')}
          </div>
        `;
        container.appendChild(section);
      });

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('zh-CN', options);

      const hour = now.getHours();
      let greeting = '夜深了，注意休息 🌙';
      if (hour >= 5 && hour < 12) greeting = '早上好，Bithou ☀️ 保持活力的一天';
      else if (hour >= 12 && hour < 14) greeting = '中午好，享受午休与美食 ☕';
      else if (hour >= 14 && hour < 18) greeting = '下午好，Bithou 👨‍💻 高效专注进行时';
      else if (hour >= 18 && hour < 23) greeting = '晚上好，放松一下看看电影 🎬';
      document.getElementById('greeting-text').textContent = greeting;
    }

    setInterval(updateClock, 1000);
    updateClock();

    let currentEngine = 'google';
    const ENGINES = {
      google: q => `https://www.google.com/search?q=${encodeURIComponent(q)}`,
      baidu: q => `https://www.baidu.com/s?wd=${encodeURIComponent(q)}`,
      github: q => `https://github.com/search?q=${encodeURIComponent(q)}`,
      douban: q => `https://search.douban.com/movie/subject_search?search_text=${encodeURIComponent(q)}`,
      moontv: q => `https://tv.282855.xyz/search?q=${encodeURIComponent(q)}`
    };

    document.querySelectorAll('.search-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.search-tab').forEach(t => {
          t.classList.remove('active', 'bg-white/10', 'text-white');
          t.classList.add('text-slate-400');
        });
        tab.classList.add('active', 'bg-white/10', 'text-white');
        tab.classList.remove('text-slate-400');
        currentEngine = tab.dataset.engine;
        document.getElementById('search-input').focus();
      });
    });

    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      if (query.match(/^https?:\/\//i) || query.match(/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/)) {
        const url = query.startsWith('http') ? query : `https://${query}`;
        window.open(url, '_blank');
        return;
      }

      const targetUrl = ENGINES[currentEngine](query);
      window.open(targetUrl, '_blank');
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
    });

    // 密码保护机制
    const SECURE_PASS = '12345688';
    let pendingAuthAction = null;

    const authModal = document.getElementById('auth-modal');
    const authForm = document.getElementById('auth-form');
    const authInput = document.getElementById('auth-password-input');
    const authError = document.getElementById('auth-error');
    const authDesc = document.getElementById('auth-desc');

    function requestAuth(actionName, onAuthenticated) {
      pendingAuthAction = onAuthenticated;
      authInput.value = '';
      authError.classList.add('hidden');
      authDesc.textContent = `为保证安全，在执行【${actionName}】前请输入管理密码：`;
      authModal.classList.remove('hidden');
      setTimeout(() => authInput.focus(), 100);
      if (window.lucide) lucide.createIcons();
    }

    function closeAuthModal() {
      authModal.classList.add('hidden');
      pendingAuthAction = null;
      authInput.value = '';
      authError.classList.add('hidden');
    }

    document.getElementById('close-auth-btn').addEventListener('click', closeAuthModal);
    document.getElementById('cancel-auth-btn').addEventListener('click', closeAuthModal);

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (authInput.value.trim() === SECURE_PASS) {
        const action = pendingAuthAction;
        closeAuthModal();
        if (typeof action === 'function') {
          action();
        }
      } else {
        authError.classList.remove('hidden');
        authInput.select();
        if (window.lucide) lucide.createIcons();
      }
    });

    const modal = document.getElementById('add-modal');
    document.getElementById('add-card-btn').addEventListener('click', () => {
      requestAuth('添加新导航卡片', () => {
        modal.classList.remove('hidden');
      });
    });
    document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));
    document.getElementById('cancel-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));

    document.getElementById('add-card-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const catId = document.getElementById('card-category').value;
      const title = document.getElementById('card-title').value.trim();
      const url = document.getElementById('card-url').value.trim();
      const desc = document.getElementById('card-desc').value.trim();
      const icon = document.getElementById('card-icon').value.trim() || 'globe';

      const cat = navData.find(c => c.id === catId);
      if (cat) {
        cat.items.push({
          name: title,
          url: url,
          desc: desc,
          icon: icon,
          color: 'from-blue-500 to-indigo-600'
        });
        localStorage.setItem('bithou_nav_data', JSON.stringify(navData));
        renderNav();
        modal.classList.add('hidden');
        document.getElementById('add-card-form').reset();
      }
    });

    document.getElementById('export-config-btn').addEventListener('click', () => {
      requestAuth('备份配置', () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(navData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `hou_open_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      });
    });

    document.getElementById('import-config-btn').addEventListener('click', () => {
      requestAuth('导入配置', () => {
        document.getElementById('import-file-input').click();
      });
    });

    document.getElementById('import-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            navData = imported;
            localStorage.setItem('bithou_nav_data', JSON.stringify(navData));
            renderNav();
            alert('导航配置已成功导入！');
          }
        } catch (err) {
          alert('导入失败，JSON 格式无效！');
        }
      };
      reader.readAsText(file);
      // 清空 input 确保同一个文件再次选择能触发 change
      e.target.value = '';
    });

    renderNav();
  </script>
</body>
</html>
